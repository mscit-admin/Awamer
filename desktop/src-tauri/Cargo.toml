[package]
name = "netsphere-terminal"
version = "1.8.0"
description = "Awamer Terminal — Enterprise Remote Administration"
authors = ["Awamer Team"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "netsphere_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-store = "2.0.0"
tauri-plugin-dialog = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = "3.2"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"

# Phase 3 — SSH
# 0.63: SECURITY (RUSTSEC-2026-0153/0154 fixed in >=0.60.3); keys are now
# `russh::keys` (the separate russh-keys crate is no longer used).
russh = "0.63"
bytes = "1.7"
async-trait = "0.1"
uuid = { version = "1.10", features = ["v4"] }
once_cell = "1.19"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Phase 3b (1.3.0) — known_hosts + key auth
base64 = "0.22"
sha2 = "0.10"
dirs = "5.0"

# Phase 4 (1.5.0) — SFTP file browser
russh-sftp = "2.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
