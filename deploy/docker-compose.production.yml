# =====================================================================
# NetSphere Terminal — Production deployment
# =====================================================================
#
# Differences from deployments/docker-compose.yml (which is for development):
#
#   - Builds the backend image directly via Dockerfile build context, with
#     a real version tag instead of relying on dev cache reuse.
#   - Volumes are NAMED, not bind-mounted, so the host filesystem layout
#     doesn't leak — data lives under Docker-managed paths and survives
#     re-creation of containers.
#   - Postgres + Redis are on a private network only (no host ports).
#     Only the backend is reachable from outside the network (and only
#     through nginx).
#   - Health checks are stricter; the auth service won't be reachable until
#     it actually answers /healthz with 200.
#   - All secrets come from .env.production (which YOU create, not stored
#     in source). No defaults — if a variable is missing, compose refuses
#     to start instead of silently using "ChangeMe!2026".
#   - Backup-friendly: postgres volume can be backed up live via
#     `docker compose exec postgres pg_dump`.
#
# Run:
#   cd deploy
#   cp .env.production.example ../.env.production
#   $EDITOR ../.env.production    # set REAL passwords + secrets
#   docker compose -f docker-compose.production.yml --env-file ../.env.production up -d
#
# =====================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: netsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER missing — check .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing — check .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB missing — check .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    # Loopback-only publish so the host-networked vpn-helper can reach the DB for
    # the built-in VPN server's per-user auth-verify. Bound to 127.0.0.1 — NOT
    # routable off-host; the backend still reaches PostgreSQL over the private
    # `internal` network by its service name.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: netsphere-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD missing}
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  auth-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: netsphere/auth-service:${APP_VERSION:-1.6.0.1}
    container_name: netsphere-auth
    restart: unless-stopped
    # SEC-INFRA-001 — the Internet-facing backend runs UNPRIVILEGED. It is a
    # dedicated non-root user, drops ALL Linux capabilities, adds none back, has
    # NO /dev/net/tun and never spawns OpenVPN. All privileged VPN work is
    # delegated to the isolated `awamer-vpn-helper` over an authenticated Unix
    # socket (shared volume below). A compromise of this container therefore
    # cannot obtain NET_ADMIN or touch the tun device.
    user: "10001:10001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vpn-helper:
        condition: service_healthy
    environment:
      # ---- Database -------------------------------------------------
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # ---- Server ---------------------------------------------------
      # Variable names must match backend/src/config/index.ts exactly.
      APP_ENV: production
      NODE_ENV: production
      AUTH_HTTP_HOST: 0.0.0.0
      AUTH_HTTP_PORT: 8081
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # ---- Crypto secrets (REQUIRED — no defaults) -----------------
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET missing — openssl rand -hex 64}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET missing}"
      # Phase 10 — encrypts credential secrets at rest (32 bytes, base64 or hex).
      CREDENTIAL_ENCRYPTION_KEY: "${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY missing — openssl rand -base64 32}"
      # ---- Bootstrap admin ------------------------------------------
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD missing — set a strong initial password}"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@netsphere.local}
      # ---- CORS — allow only the configured frontend origins -------
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost,tauri://localhost,https://tauri.localhost}
      # ---- Rate limiting --------------------------------------------
      RATE_LIMIT_LOGIN_PER_MIN: ${RATE_LIMIT_LOGIN_PER_MIN:-10}
      RATE_LIMIT_API_PER_MIN: ${RATE_LIMIT_API_PER_MIN:-120}
      # ---- SEC-INFRA-001: privileged VPN helper IPC ----------------
      # The backend never spawns OpenVPN; it talks to awamer-vpn-helper over
      # this shared Unix socket, authenticated with a high-entropy shared secret.
      VPN_HELPER_SOCKET: /run/awamer/ipc/vpn-helper.sock
      VPN_HELPER_SECRET: "${VPN_HELPER_SECRET:?VPN_HELPER_SECRET missing — openssl rand -hex 32}"
      # ---- Multi-VPN-Server dynamic port policy --------------------
      # Each VPN Server is assigned its own port+protocol from this range (the DB
      # record is authoritative). Keep aligned with the vpn-helper's env.
      VPN_SERVER_PORT_MIN: ${VPN_SERVER_PORT_MIN:-20000}
      VPN_SERVER_PORT_MAX: ${VPN_SERVER_PORT_MAX:-30000}
      VPN_FIREWALL_BACKEND: ${VPN_FIREWALL_BACKEND:-iptables}
      # Extra reserved ports a VPN Server may never use (e.g. the public HTTPS
      # port); 22/80/443/backend/PostgreSQL/Redis are always reserved.
      VPN_RESERVED_PORTS: ${VPN_RESERVED_PORTS:-}
    ports:
      # Bind to LOCALHOST ONLY — nginx will reverse-proxy from public 443.
      # NOTE: the backend NO LONGER publishes the OpenVPN server port; the
      # OpenVPN server (when used) runs inside awamer-vpn-helper.
      - "127.0.0.1:8081:8081"
    networks:
      - internal
    volumes:
      # Authenticated IPC channel to the privileged helper (socket only).
      - vpn-helper-run:/run/awamer
    # SEC-INFRA-001 — UNPRIVILEGED: drop ALL capabilities and add NONE back; no
    # tun device; no ip_forward. no-new-privileges blocks any setuid escalation.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Run migrations on startup
    command: >
      sh -c "
        echo 'Running database migrations...' &&
        node /app/dist/migrate.js up || exit 1 ;
        echo 'Starting server...' &&
        exec node --enable-source-maps /app/dist/server.js
      "

  # ===================================================================
  # SEC-INFRA-001 — awamer-vpn-helper: the ONLY privileged component.
  # Minimal service that performs the privileged OpenVPN lifecycle. It holds
  # NET_ADMIN + /dev/net/tun and NOTHING else, publishes NO public port (its API
  # is the owner-group-only Unix socket in the shared volume), and is never
  # reachable from the Internet. If this container is unavailable, VPN operations
  # in the backend FAIL CLOSED — the backend never falls back to local OpenVPN.
  # ===================================================================
  vpn-helper:
    build:
      context: ../backend
      dockerfile: Dockerfile.vpn-helper
    image: netsphere/vpn-helper:${APP_VERSION:-1.6.0.1}
    container_name: netsphere-vpn-helper
    restart: unless-stopped
    # Runs as root (privileged component) but with the BACKEND's gid (10001) as
    # its group, so the Unix socket it creates is group-owned by 10001 and the
    # unprivileged backend can connect WITHOUT the helper needing CAP_CHOWN.
    user: "0:10001"
    depends_on:
      postgres:
        condition: service_healthy
    # MULTI-VPN-SERVER dynamic ports (§3): the helper uses HOST networking so each
    # dynamically-created OpenVPN SERVER binds its OWN host port (from the
    # VPN_SERVER_PORT_MIN..MAX range) WITHOUT recreating the container or
    # publishing a static port. This is the smallest safe design for dynamic
    # listeners. Increased exposure is bounded: the ONLY network listeners this
    # container opens are validated OpenVPN data-plane ports; its control/IPC
    # surface is the owner-group-only Unix socket in the shared volume (a
    # filesystem socket, unaffected by host networking) — there is NO TCP/HTTP
    # control API and no administrative listener.
    network_mode: host
    environment:
      # Host networking → the bridge DNS name `postgres` is unreachable; the
      # helper reaches PostgreSQL over the host loopback publish (see postgres
      # service). Used ONLY by the built-in server's per-user auth-verify child.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}
      VPN_HELPER_SOCKET: /run/awamer/ipc/vpn-helper.sock
      VPN_HELPER_SECRET: "${VPN_HELPER_SECRET:?VPN_HELPER_SECRET missing — openssl rand -hex 32}"
      OPENVPN_PATH: /usr/sbin/openvpn
      VPN_RUNTIME_DIR: /var/lib/awamer/vpn-runtime
      # Per-server firewall (iptables) + the port window it may touch. Keep these
      # aligned with the backend's VPN_SERVER_PORT_MIN/MAX. The helper VERIFIES the
      # backend exists + runs at startup (MULTI-VPN-FW-001) and fails closed
      # otherwise. On the Alpine helper image `iptables` is at /sbin/iptables.
      VPN_FIREWALL_BACKEND: ${VPN_FIREWALL_BACKEND:-iptables}
      IPTABLES_PATH: ${IPTABLES_PATH:-/sbin/iptables}
      VPN_SERVER_PORT_MIN: ${VPN_SERVER_PORT_MIN:-20000}
      VPN_SERVER_PORT_MAX: ${VPN_SERVER_PORT_MAX:-30000}
    volumes:
      - vpn-helper-run:/run/awamer
    # NO static `ports:` — with host networking each VPN Server's OpenVPN listener
    # binds its own host port directly; the helper opens the matching host
    # firewall rule per server (iptables). The control/IPC surface is never a
    # network port. cap_drop ALL + NET_ADMIN only (also lets it manage its own
    # per-server iptables rules); not privileged.
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/awamer/ipc/vpn-helper.sock"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
    name: netsphere-postgres-data
  redis-data:
    name: netsphere-redis-data
  vpn-helper-run:
    name: netsphere-vpn-helper-run

networks:
  internal:
    name: netsphere-internal
