# =====================================================================
# NetSphere Terminal — nginx reverse proxy
# =====================================================================
#
# Place this file at:    /etc/nginx/sites-available/netsphere
# Symlink to:            /etc/nginx/sites-enabled/netsphere
#
# Then:
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Replace netsphere.example.com with your actual domain. Get an SSL
# certificate first via Let's Encrypt:
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d netsphere.example.com
#
# certbot will automatically modify this file to use the issued cert.
# =====================================================================

# Redirect plain HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name netsphere.example.com;

    # Let's Encrypt ACME challenges go through HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name netsphere.example.com;

    # ---- TLS (certbot will fill these in) -----------------------------
    # ssl_certificate     /etc/letsencrypt/live/netsphere.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/netsphere.example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Security headers --------------------------------------------
    # HSTS — once you trust this is working, set max-age higher and add preload
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- Body size — credentials/keys are small, no need for large uploads
    client_max_body_size 16M;

    # ---- Logging ------------------------------------------------------
    access_log /var/log/nginx/netsphere-access.log;
    error_log  /var/log/nginx/netsphere-error.log warn;

    # ---- The API ------------------------------------------------------
    # Proxy /api/v1/* to the backend on 127.0.0.1:8081
    location /api/ {
        proxy_pass http://127.0.0.1:8081;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Don't buffer responses so log streaming / SSE works if added later
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8081/healthz;
        access_log off;
    }

    # ---- Default — explicitly refuse non-API traffic ------------------
    # NetSphere has no web frontend — the desktop client speaks to /api/
    # directly. Make this explicit so misdirected traffic gets a clear
    # message rather than a confusing 404.
    location / {
        return 404 "NetSphere API server. The desktop client should be configured to connect to /api/v1.";
        add_header Content-Type "text/plain";
    }
}
