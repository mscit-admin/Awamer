# =====================================================================
# NetSphere Terminal — nginx reverse proxy (HTTPS on port 6655)
# =====================================================================
#
# Place this file at:    /etc/nginx/sites-available/awamer
# Symlink to:            /etc/nginx/sites-enabled/awamer
#
# Replace netsphere.example.com with your actual hostname (the install
# commands do this via sed). This config serves HTTPS on port 6655 and
# redirects plain HTTP (port 80) to it.
#
# IMPORTANT — this is the FINAL (HTTPS) config: the ssl_* directives below
# reference cert files that must already exist, so `nginx -t` fails until the
# certificate has been issued. deploy/scripts/install.sh handles this ordering
# automatically (DEPLOY-002): it serves an HTTP-only bootstrap vhost first,
# obtains the certificate via the webroot below, and only THEN enables this
# file. To do it by hand on a fresh host:
#
#   mkdir -p /var/www/certbot
#   # (serve /.well-known/acme-challenge/ from /var/www/certbot on port 80)
#   certbot certonly --webroot -w /var/www/certbot -d YOUR_HOST \
#       --agree-tos --no-eff-email -m you@example.com
#   # then install this file, sed the host, and: nginx -t && systemctl reload nginx
#
# Renewal: the port-80 server block below already serves the ACME webroot, so
# `certbot renew` works with nginx running (no downtime, no standalone hooks).
# =====================================================================

# Maps $http_upgrade → the right Connection header for WebSocket proxying.
# (Defined here at http-include scope; used by the /api/ location below.)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# SEC-001 (defense-in-depth): log the request PATH only, never the query
# string. WebSocket gateways authenticate over the channel (SSH/Telnet/tunnel
# send the access token + any secrets in the first WS frame; VNC uses a one-time
# ticket in ?ticket=…) — no session JWT or credential ever appears in a WS URL.
# Logging $uri (the normalized path without args) is belt-and-suspenders so no
# query value can ever reach the access log. $request/$request_uri include args.
log_format noquery '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status '
                   '$body_bytes_sent "$http_referer" "$http_user_agent"';

# Redirect plain HTTP → HTTPS on 6655 (and serve ACME challenges)
server {
    listen 80;
    listen [::]:80;
    server_name netsphere.example.com;

    # Let's Encrypt ACME challenges (webroot renewals, if used)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host:6655$request_uri;
    }
}

server {
    # DEPLOY-001: enable HTTP/2 via the `listen … http2` parameter rather than
    # the standalone `http2 on;` directive. The parameter form works on the
    # distro nginx shipped with Ubuntu 22.04/24.04 (nginx 1.18/1.24) AND on
    # newer nginx (1.25+ still accepts it, with a deprecation notice), so the
    # shipped config never forces users onto a third-party nginx repo.
    listen 6655 ssl http2;
    listen [::]:6655 ssl http2;
    server_name netsphere.example.com;

    # ---- Web frontend (built SPA) -------------------------------------
    # Build with:  VITE_API_BASE_URL=https://<host>:6655 npm run build
    # then copy desktop/dist/* into /var/www/awamer/
    root /var/www/awamer;
    index index.html;

    # ---- TLS ----------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/netsphere.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/netsphere.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ---- Security headers --------------------------------------------
    # HSTS — once you trust this is working, set max-age higher and add preload
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- Content-Security-Policy (SEC-006) ---------------------------
    # Tight policy for the built React SPA. The app ships no external scripts,
    # fonts or styles (all bundled by Vite; icons/QR are data: URIs), so every
    # source is 'self' except:
    #   - style-src 'unsafe-inline': xterm.js and React set element inline
    #     styles (styles can't execute code — no script risk). NO 'unsafe-eval'
    #     or inline SCRIPT is permitted.
    #   - connect-src 'self': same-origin REST + WebSocket gateways (the API is
    #     reverse-proxied under the same origin), which 'self' covers for ws/wss.
    #   - script-src 'wasm-unsafe-eval': the KeePass import compiles Argon2 via
    #     hash-wasm (WebAssembly, inlined — no .wasm file). This narrow token
    #     permits WASM compilation ONLY; it does NOT permit JS eval()/Function.
    # frame-ancestors 'none' backs up X-Frame-Options against clickjacking.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; form-action 'self'" always;

    # ---- Body size — credentials/keys are small, no need for large uploads
    client_max_body_size 16M;

    # ---- Logging ------------------------------------------------------
    access_log /var/log/nginx/netsphere-access.log noquery;
    error_log  /var/log/nginx/netsphere-error.log warn;

    # ---- The API ------------------------------------------------------
    # Proxy /api/v1/* to the backend on 127.0.0.1:8081
    location /api/ {
        proxy_pass http://127.0.0.1:8081;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket upgrade (browser SSH gateway at /api/v1/ssh/connect)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        # Long send/read timeouts so idle SSH WebSockets aren't dropped at 60s.
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Don't buffer responses so log streaming / SSE works if added later
        proxy_buffering off;
    }

    # Liveness: the backend process is up. Used by container/liveness checks.
    location = /healthz {
        proxy_pass http://127.0.0.1:8081/healthz;
        access_log off;
    }

    # Readiness (AWM-STAB-002): the backend + its required dependencies
    # (PostgreSQL) are ready to serve. MUST be proxied to the backend explicitly,
    # otherwise the SPA `try_files … /index.html` fallback below would answer
    # /readyz with index.html and mask an unready backend. Used by the reverse
    # proxy / load balancer and the deployment rollout gate.
    location = /readyz {
        proxy_pass http://127.0.0.1:8081/readyz;
        access_log off;
    }

    # ---- Web frontend (SPA) -------------------------------------------
    # Serve the built single-page app; fall back to index.html so client-side
    # routes (e.g. /settings, /hosts) resolve on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
