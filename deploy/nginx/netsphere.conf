# =====================================================================
# NetSphere Terminal — nginx reverse proxy (HTTPS on port 6655)
# =====================================================================
#
# Place this file at:    /etc/nginx/sites-available/awamer
# Symlink to:            /etc/nginx/sites-enabled/awamer
#
# Replace netsphere.example.com with your actual hostname (the install
# commands do this via sed). This config serves HTTPS on port 6655 and
# redirects plain HTTP (port 80) to it.
#
# IMPORTANT — obtain the certificate BEFORE enabling this config, because
# the SSL server block below references cert files that must already exist
# (otherwise `nginx -t` fails). Cert-first flow:
#
#   systemctl stop nginx 2>/dev/null || true
#   certbot certonly --standalone -d YOUR_HOST --agree-tos --no-eff-email -m you@example.com
#   # then install this file, sed the host, and: nginx -t && systemctl restart nginx
#
# Renewal note: standalone needs port 80 free, so renew with hooks:
#   certbot renew --pre-hook "systemctl stop nginx" --post-hook "systemctl start nginx"
# =====================================================================

# Redirect plain HTTP → HTTPS on 6655 (and serve ACME challenges)
server {
    listen 80;
    listen [::]:80;
    server_name netsphere.example.com;

    # Let's Encrypt ACME challenges (webroot renewals, if used)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host:6655$request_uri;
    }
}

server {
    listen 6655 ssl http2;
    listen [::]:6655 ssl http2;
    server_name netsphere.example.com;

    # ---- Web frontend (built SPA) -------------------------------------
    # Build with:  VITE_API_BASE_URL=https://<host>:6655 npm run build
    # then copy desktop/dist/* into /var/www/awamer/
    root /var/www/awamer;
    index index.html;

    # ---- TLS ----------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/netsphere.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/netsphere.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ---- Security headers --------------------------------------------
    # HSTS — once you trust this is working, set max-age higher and add preload
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- Body size — credentials/keys are small, no need for large uploads
    client_max_body_size 16M;

    # ---- Logging ------------------------------------------------------
    access_log /var/log/nginx/netsphere-access.log;
    error_log  /var/log/nginx/netsphere-error.log warn;

    # ---- The API ------------------------------------------------------
    # Proxy /api/v1/* to the backend on 127.0.0.1:8081
    location /api/ {
        proxy_pass http://127.0.0.1:8081;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Don't buffer responses so log streaming / SSE works if added later
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8081/healthz;
        access_log off;
    }

    # ---- Web frontend (SPA) -------------------------------------------
    # Serve the built single-page app; fall back to index.html so client-side
    # routes (e.g. /settings, /hosts) resolve on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
