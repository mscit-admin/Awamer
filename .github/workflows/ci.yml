name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck · lint · test · integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: awamer
          POSTGRES_PASSWORD: awamer
          POSTGRES_DB: awamer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U awamer" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Test-only dummy secrets (not real credentials) so loadConfig() passes.
      DATABASE_URL: postgres://awamer:awamer@localhost:5432/awamer
      APP_ENV: development
      JWT_ACCESS_SECRET: ci_access_secret_ci_access_secret_ci_access_secret_0001
      JWT_REFRESH_SECRET: ci_refresh_secret_ci_refresh_secret_ci_refresh_secret_02
      CREDENTIAL_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      BOOTSTRAP_ADMIN_PASSWORD: CiP@ssw0rd!x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run migrate:up
      - run: npm run test:integration
      # Advisory until the known advisories are remediated; then drop the flag.
      - name: npm audit (high)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  desktop:
    name: Desktop (typecheck · lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: npm audit (high)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  rust:
    name: Tauri crate (fmt · clippy · check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System libraries (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev build-essential pkg-config
      - run: cargo check
      # Advisory until the codebase is brought into fmt/clippy conformance.
      - name: cargo fmt --check
        run: cargo fmt --check
        continue-on-error: true
      - name: cargo clippy
        run: cargo clippy -- -D warnings
        continue-on-error: true
